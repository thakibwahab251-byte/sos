<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SilentSOS - Intelligent Emergency Detection{% endblock %}</title>
  
  <!-- Modern Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- Leaflet CSS for Maps -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  
  <!-- Core Design System CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block extra_css %}{% endblock %}
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <a href="{{ url_for('index') }}" class="nav-brand">
      <div class="brand-icon">🚨</div>
      <div class="brand-title">
        SilentSOS
        <span class="brand-badge">Sentinel AI</span>
      </div>
    </a>

    <ul class="nav-links">
      <li class="nav-item">
        <a href="{{ url_for('index') }}" class="{% if request.path == '/' %}active{% endif %}">
          <span>🏠</span> Overview
        </a>
      </li>
      <li class="nav-item">
        <a href="{{ url_for('mobile_simulator') }}" class="{% if request.path == '/mobile' %}active{% endif %}">
          <span>📱</span> Mobile Simulator
        </a>
      </li>
      <li class="nav-item">
        <a href="{{ url_for('dashboard') }}" class="{% if request.path == '/dashboard' %}active{% endif %}">
          <span>🛰️</span> Guardian Dashboard
        </a>
      </li>
      <li class="nav-item">
        <a href="{{ url_for('architecture') }}" class="{% if request.path == '/architecture' %}active{% endif %}">
          <span>🧠</span> AI Architecture
        </a>
      </li>
      <li class="nav-item">
        <a href="{{ url_for('contacts_view') }}" class="{% if request.path == '/contacts' %}active{% endif %}">
          <span>👼</span> Guardian Angels
        </a>
      </li>
      <li class="nav-item">
        <a href="{{ url_for('sessions_view') }}" class="{% if request.path == '/sessions' %}active{% endif %}">
          <span>⏱️</span> Safety Sessions
        </a>
      </li>
    </ul>

    <div class="nav-status">
      <div class="status-pulse"></div>
      <span>SYSTEM ARMED</span>
    </div>
  </nav>

  <!-- Main Content Wrapper -->
  <main class="main-wrapper">
    {% block content %}{% endblock %}
  </main>

  <!-- Leaflet Map JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  
  <!-- Core App JS -->
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block extra_js %}{% endblock %}

</body>
</html>
